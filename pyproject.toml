[build-system]
requires = [
  "scikit-build-core>=0.11",
  "pybind11>=2.11",
]
build-backend = "scikit_build_core.build"

[project]
name = "mylib-apps"
version = "0.1.0"
description = "Console apps for a C++ library, backed by a shared pybind11 extension"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Your Name" }]
license = { text = "Proprietary" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: OS Independent",
]

# Python runtime dependencies shared by the console apps
dependencies = [
  "numpy>=1.22",
  "matplotlib>=3.6",
]

## No Python testing dependencies; Python is only a small set of console apps.

[project.scripts]
mylib-plot = "mylib_plot.cli:main"
mylib-dump = "mylib_dump.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = [
  "python/mylib_internal",
  "python/mylib_plot",
  "python/mylib_dump",
]
build-dir = "out/_skbuild"
build.verbose = false
cmake.build-type = "Release"
cmake.version = ">=3.26"

[tool.scikit-build.cmake.define]
MYLIB_BUILD_PYTHON = true
CMAKE_POSITION_INDEPENDENT_CODE = true
