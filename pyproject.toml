[project]
name = "mylib-tools"
dynamic = ["version"]
description = "Console apps for a C++ library, backed by a shared pybind11 extension"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Your Name" }]
license = { text = "Proprietary" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: OS Independent",
]

# Python runtime dependencies shared by the console apps
dependencies = [
  "numpy>=1.22",
  "matplotlib>=3.6",
]

[dependency-groups]
dev = [
  "ruff>=0.16.0",
]

## No Python testing dependencies; Python is only a small set of console apps.

[build-system]
requires = [
  "scikit-build-core>=0.12,<1",
  "pybind11>=2.11",
]
build-backend = "scikit_build_core.build"

[project.scripts]
mylib-plot = "mylib_tools.plot:main"
mylib-dump = "mylib_tools.dump:main"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "vcpkg.json" },
]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = [
  "python/src/mylib_tools",
]
install.components = ["python"]
build-dir = "out/_skbuild/{wheel_tag}"
build.verbose = false
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "vcpkg.json"
regex = '''"version"\s*:\s*"(?P<value>[^"]+)"'''

[tool.scikit-build.cmake.define]
BUILD_SHARED_LIBS = false
MYLIB_BUILD_APPS = false
MYLIB_BUILD_EXAMPLES = false
MYLIB_BUILD_TESTING = false
MYLIB_BUILD_PYTHON = true
CMAKE_POSITION_INDEPENDENT_CODE = true

[tool.ruff]
line-length = 88
src = ["python/src"]
extend-exclude = ["out"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
