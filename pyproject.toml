[build-system]
requires = [
  "scikit-build-core>=0.11",
  "nanobind>=2.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "mylib-apps"
version = "0.1.0"
description = "Apps for a C++ library: nanobind-backed plotting/visualization"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Your Name" }]
license = { text = "Proprietary" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: OS Independent",
]

# Python runtime dependencies for analysis/plotting use of the binding
dependencies = [
  "numpy>=1.22",
  "matplotlib>=3.6",
]

## No Python testing dependencies; Python is only a small visualization script.

[project.scripts]
mylib-plot = "mylib_apps.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/mylib_apps"]
build-dir = "out/_skbuild"
build.verbose = false
cmake.build-type = "Release"
cmake.version = ">=3.25"

[tool.scikit-build.cmake.define]
BUILD_PYTHON = true
CMAKE_POSITION_INDEPENDENT_CODE = true
