name: Set up pinned LLVM compiler
description: Download and verify the repository's pinned LLVM compiler toolchain.

inputs:
  version:
    description: Exact LLVM release version to install.
    required: false
    default: "22.1.6"
  linux-x64-sha256:
    description: SHA-256 digest of the official Linux x64 release archive.
    required: false
    default: c5ac8ef89ca39d30cb32e9b83772f995dd891c685ebc188d593c943a64d5f8b5
  windows-x64-sha256:
    description: SHA-256 digest of the official Windows x64 installer.
    required: false
    default: e2d9a6855ff22c0acf3adc87ff1e1ad9705b8b6fc5bab2542aefc3315fc24cf7

runs:
  using: composite
  steps:
    - name: Validate the runner
      shell: bash
      run: |
        if [[ "${RUNNER_ARCH}" != "X64" ]]; then
          echo "Unsupported runner architecture: ${RUNNER_ARCH}" >&2
          exit 1
        fi
        if [[ "${RUNNER_OS}" != "Linux" && "${RUNNER_OS}" != "Windows" ]]; then
          echo "Unsupported runner operating system: ${RUNNER_OS}" >&2
          exit 1
        fi

    - name: Install LLVM on Linux
      if: runner.os == 'Linux'
      shell: bash
      env:
        LLVM_VERSION: ${{ inputs.version }}
        LLVM_SHA256: ${{ inputs.linux-x64-sha256 }}
      run: |
        set -euo pipefail

        archive="${RUNNER_TEMP}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"
        install_dir="${RUNNER_TEMP}/llvm-${LLVM_VERSION}"
        url="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/LLVM-${LLVM_VERSION}-Linux-X64.tar.xz"

        if [[ -e "${install_dir}" ]]; then
          echo "LLVM installation path already exists: ${install_dir}" >&2
          exit 1
        fi

        curl --fail --location --retry 5 --retry-all-errors \
          --output "${archive}" "${url}"
        echo "${LLVM_SHA256}  ${archive}" | sha256sum --check --status

        mkdir "${install_dir}"
        tar --extract --xz --file "${archive}" --directory "${install_dir}" \
          --strip-components 1
        rm --force -- "${archive}"

        installed_version="$(
          "${install_dir}/bin/clang" --version |
            sed -n '1s/.*clang version \([^ ]*\).*/\1/p'
        )"
        if [[ "${installed_version}" != "${LLVM_VERSION}" ]]; then
          echo "Expected LLVM ${LLVM_VERSION}, found ${installed_version}" >&2
          exit 1
        fi

        echo "${install_dir}/bin" >> "${GITHUB_PATH}"
        echo "LLVM_PATH=${install_dir}" >> "${GITHUB_ENV}"
        echo "LD_LIBRARY_PATH=${install_dir}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" \
          >> "${GITHUB_ENV}"

    - name: Install LLVM on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        LLVM_VERSION: ${{ inputs.version }}
        LLVM_SHA256: ${{ inputs.windows-x64-sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'

        $archive = Join-Path $env:RUNNER_TEMP "LLVM-$env:LLVM_VERSION-win64.exe"
        $installDir = Join-Path $env:RUNNER_TEMP "llvm-$env:LLVM_VERSION"
        $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/LLVM-$env:LLVM_VERSION-win64.exe"

        if (Test-Path -LiteralPath $installDir) {
          throw "LLVM installation path already exists: $installDir"
        }

        curl.exe --fail --location --retry 5 --retry-all-errors `
          --output $archive $url
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to download LLVM $env:LLVM_VERSION"
        }

        $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
        if ($actualHash -ne $env:LLVM_SHA256) {
          throw "LLVM archive digest mismatch: expected $env:LLVM_SHA256, found $actualHash"
        }

        New-Item -ItemType Directory -Path $installDir | Out-Null
        7z x $archive "-o$installDir" -y
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to extract LLVM $env:LLVM_VERSION"
        }
        Remove-Item -LiteralPath $archive

        $llvmBin = Join-Path $installDir 'bin'
        $clang = Join-Path $llvmBin 'clang-cl.exe'
        $versionOutput = & $clang --version | Select-Object -First 1
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to run $clang"
        }
        $installedVersion = [regex]::Match($versionOutput, 'clang version ([^ ]+)').Groups[1].Value
        if ($installedVersion -ne $env:LLVM_VERSION) {
          throw "Expected LLVM $env:LLVM_VERSION, found $installedVersion"
        }

        $llvmBin >> $env:GITHUB_PATH
        "LLVM_PATH=$installDir" >> $env:GITHUB_ENV
