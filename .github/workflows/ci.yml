name: CI

on:
  push:
  pull_request:

jobs:
  cmake:
    name: ${{ matrix.os }} C++ (CMake Presets)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: ci-linux-all
            example: out/build/ci-linux/mylib_example
          - os: windows-latest
            preset: ci-windows-all
            example: out/build/ci-windows/Release/mylib_example.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run CMake workflow preset
        run: cmake --workflow --preset ${{ matrix.preset }}

      - name: Run example
        shell: bash
        run: |
          chmod +x "${{ matrix.example }}" || true
          "${{ matrix.example }}"

  nix:
    name: Nix (flake)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Nix flake show
        run: nix flake show

      - name: Build default package (C++ library)
        run: nix build .#default -L

      - name: Run C++ example via flake app
        run: nix run .#mylib-example

      - name: Build python-app env
        run: nix build .#python-app -L
