name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cmake-linux:
    name: Linux C++ (CMake CI Workflow)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy gcc-14 g++-14

      - name: Run CMake workflow preset
        env:
          CC: gcc-14
          CXX: g++-14
        run: cmake --workflow --preset ci-linux-all

      - name: Run example
        shell: bash
        run: |
          "out/build/ci-linux/examples/mylib-cpp-example"

  python-linux:
    name: Linux Python (uv + nanobind smoke test)
    runs-on: ubuntu-latest
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync project
        run: uv sync --frozen

      - name: Import extension
        run: uv run python -c "import mylib_apps._core as m; print(m.compute_value(3.0)); print(m.compute_values(-1.0, 1.0, 3))"

      - name: Run plotting CLI
        run: uv run mylib-plot --save out/ci-plot.png

  cmake-windows:
    name: Windows C++ (CMake CI Workflow)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "19"

      - name: Set up environment
        run: |
          $info = vswhere -latest -format json | ConvertFrom-Json
          $module_name = 'Microsoft.VisualStudio.DevShell.dll'
          $module_path = Join-Path $info.installationPath 'Common7' 'Tools' $module_name
          Import-Module $module_path
          Enter-VsDevShell -VsInstanceId $info.instanceId -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -no_logo"
          # Update the current environment:
          Get-ChildItem 'env:' | %{ echo "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }

      - name: Run CMake workflow preset
        run: cmake --workflow --preset ci-windows-all

      - name: Run example
        shell: pwsh
        run: |
          ./out/build/ci-windows/examples/mylib-cpp-example.exe

  nix:
    name: Nix (flake)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Nix flake show
        run: nix flake show

      - name: Build default package (C++ library)
        run: nix build .#default -L

      - name: Nix flake check
        run: nix flake check -L

      - name: Run C++ example via flake app
        run: nix run .#mylib-example

      - name: Build python-app env
        run: nix build .#python-app -L
