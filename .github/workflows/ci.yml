name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  formatting:
    name: Formatting (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up repository tools
        uses: jdx/mise-action@v4
        with:
          install_args: dprint just

      - name: Install LLVM 22
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "22.1.6"
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/LLVM-22.1.6-Linux-X64.tar.xz
          directory: ${{ runner.temp }}/llvm
          env: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check formatting
        run: just format-check

  native-linux:
    name: Native package (Linux ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - name: Clang
            compiler: clang
            cc: clang
            cxx: clang++
            llvm_url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/LLVM-22.1.6-Linux-X64.tar.xz
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/cmake/toolchains/vcpkg.cmake
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure CMake and Ninja are installed
        shell: bash
        run: |
          # Required for local act runs; its reduced Ubuntu image omits both tools.
          if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build
          fi

          cmake --version
          ninja --version

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Install GCC 14
        if: matrix.compiler == 'gcc'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      - name: Install LLVM 22
        if: matrix.compiler == 'clang'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "22.1.6"
          force-url: ${{ matrix.llvm_url }}
          env: false

      - name: Select the installed Clang compiler
        if: matrix.compiler == 'clang'
        shell: bash
        run: |
          echo "CC=${LLVM_PATH}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PATH}/bin/clang++" >> "$GITHUB_ENV"

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux
          toolchain: ${{ matrix.compiler }}
          feature-profile: core

      - name: Validate native static Release
        run: just cpp validate release

      - name: Check installed static CMake package
        run: just cpp check-installed release

      - name: Validate native shared Release
        run: just cpp validate shared-release

      - name: Check installed shared CMake package
        run: just cpp check-installed shared-release

  native-windows:
    name: Native package (Windows ${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            compiler: msvc
            cc: cl.exe
            cxx: cl.exe
          - name: clang-cl
            compiler: clang-cl
            cc: clang-cl.exe
            cxx: clang-cl.exe
            llvm_url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/LLVM-22.1.6-win64.exe
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/cmake/toolchains/vcpkg.cmake
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Install LLVM 22
        if: matrix.compiler == 'clang-cl'
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "22.1.6"
          force-url: ${{ matrix.llvm_url }}
          env: false

      - name: Set up the Visual Studio environment
        shell: pwsh
        run: |
          $info = vswhere -latest -format json | ConvertFrom-Json
          $moduleName = 'Microsoft.VisualStudio.DevShell.dll'
          $modulePath = Join-Path $info.installationPath 'Common7' 'Tools' $moduleName
          Import-Module $modulePath
          Enter-VsDevShell `
            -VsInstanceId $info.instanceId `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -no_logo"
          Get-ChildItem 'env:' | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }

      - name: Select the installed clang-cl compiler
        if: matrix.compiler == 'clang-cl'
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:LLVM_PATH 'bin'
          $llvmBin >> $env:GITHUB_PATH
          "CC=$(Join-Path $llvmBin 'clang-cl.exe')" >> $env:GITHUB_ENV
          "CXX=$(Join-Path $llvmBin 'clang-cl.exe')" >> $env:GITHUB_ENV

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows
          toolchain: ${{ matrix.compiler }}
          feature-profile: core

      - name: Validate native static Release
        run: just cpp validate release

      - name: Check installed static CMake package
        run: just cpp check-installed release

      - name: Validate native shared Release
        run: just cpp validate shared-release

      - name: Check installed shared CMake package
        run: just cpp check-installed shared-release

  quality-linux:
    name: Native quality (Linux Clang, Python 3.12)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/cmake/toolchains/vcpkg.cmake
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure CMake and Ninja are installed
        shell: bash
        run: |
          # Required for local act runs; its reduced Ubuntu image omits both tools.
          if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build
          fi

          cmake --version
          ninja --version

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Install build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Install LLVM 22
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "22.1.6"
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/LLVM-22.1.6-Linux-X64.tar.xz
          env: false

      - name: Select the installed Clang compiler
        shell: bash
        run: |
          echo "CC=${LLVM_PATH}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PATH}/bin/clang++" >> "$GITHUB_ENV"

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux
          toolchain: clang
          feature-profile: core-python

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate native Python quality configuration
        run: |
          # Configure freshly while keeping vcpkg's Python build within the runner disk limit.
          cmake --preset python-quality --fresh -DVCPKG_INSTALL_OPTIONS=--clean-after-build
          just cpp build python-quality
          just cpp verify-headers python-quality
          just cpp test python-quality

  quality-windows:
    name: Native quality (Windows clang-cl, Python 3.12)
    runs-on: windows-latest
    env:
      CC: clang-cl.exe
      CXX: clang-cl.exe
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/cmake/toolchains/vcpkg.cmake
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Install LLVM 22
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "22.1.6"
          force-url: https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/LLVM-22.1.6-win64.exe
          env: false

      - name: Set up the Visual Studio environment
        shell: pwsh
        run: |
          $info = vswhere -latest -format json | ConvertFrom-Json
          $moduleName = 'Microsoft.VisualStudio.DevShell.dll'
          $modulePath = Join-Path $info.installationPath 'Common7' 'Tools' $moduleName
          Import-Module $modulePath
          Enter-VsDevShell `
            -VsInstanceId $info.instanceId `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -no_logo"
          Get-ChildItem 'env:' | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }

      - name: Select the installed clang-cl compiler
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:LLVM_PATH 'bin'
          $llvmBin >> $env:GITHUB_PATH
          "CC=$(Join-Path $llvmBin 'clang-cl.exe')" >> $env:GITHUB_ENV
          "CXX=$(Join-Path $llvmBin 'clang-cl.exe')" >> $env:GITHUB_ENV

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows
          toolchain: clang-cl
          feature-profile: core-python

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate native Python quality configuration
        run: |
          # Configure freshly while keeping vcpkg's Python build within the runner disk limit.
          cmake --preset python-quality --fresh -DVCPKG_INSTALL_OPTIONS=--clean-after-build
          just cpp build python-quality
          just cpp verify-headers python-quality
          just cpp test python-quality

  python-apps-linux:
    name: Python apps (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: &python-lines
          - "3.12"
          - "3.14"
    env:
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/cmake/toolchains/vcpkg.cmake
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux
          toolchain: gcc
          feature-profile: core

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check Python applications
        run: just py smoke

  python-apps-windows:
    name: Python apps (Windows, Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: *python-lines
    env:
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/cmake/toolchains/vcpkg.cmake
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Set up the Visual Studio environment
        shell: pwsh
        run: |
          $info = vswhere -latest -format json | ConvertFrom-Json
          $moduleName = 'Microsoft.VisualStudio.DevShell.dll'
          $modulePath = Join-Path $info.installationPath 'Common7' 'Tools' $moduleName
          Import-Module $modulePath
          Enter-VsDevShell `
            -VsInstanceId $info.instanceId `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -no_logo"
          Get-ChildItem 'env:' | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows
          toolchain: msvc
          feature-profile: core

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Check Python applications
        run: just py smoke

  wheel-linux:
    name: Wheel (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: *python-lines
    env:
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/cmake/toolchains/vcpkg.cmake
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux
          toolchain: gcc
          feature-profile: core

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build and smoke-test the wheel
        run: just py check-wheel

  wheel-windows:
    name: Wheel (Windows, Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: *python-lines
    env:
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/cmake/toolchains/vcpkg.cmake
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Just
        uses: extractions/setup-just@v4

      - name: Set up the Visual Studio environment
        shell: pwsh
        run: |
          $info = vswhere -latest -format json | ConvertFrom-Json
          $moduleName = 'Microsoft.VisualStudio.DevShell.dll'
          $modulePath = Join-Path $info.installationPath 'Common7' 'Tools' $moduleName
          Import-Module $modulePath
          Enter-VsDevShell `
            -VsInstanceId $info.instanceId `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -no_logo"
          Get-ChildItem 'env:' | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows
          toolchain: msvc
          feature-profile: core

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build and smoke-test the wheel
        run: just py check-wheel

  nix:
    name: Nix
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check the flake
        run: nix flake check -L

      - name: Smoke-test the development workflow
        run: nix develop --command just verify

      - name: Create smoke-test output directory
        run: mkdir -p out/smoke/nix

      - name: Smoke-test packaged plotting application
        run: nix run .#mylib-plot -- --points 3 --save out/smoke/nix/plot.png

      - name: Smoke-test packaged CSV application
        run: nix run .#mylib-dump -- --points 3 --output out/smoke/nix/values.csv
