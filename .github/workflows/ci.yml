name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # Do not let repository-tool installs resolve missing lock data in CI.
  MISE_LOCKED: "1"
  LLVM_VERSION: "22.1.6"
  LLVM_LINUX_X64_SHA256: c5ac8ef89ca39d30cb32e9b83772f995dd891c685ebc188d593c943a64d5f8b5
  LLVM_WINDOWS_X64_SHA256: e2d9a6855ff22c0acf3adc87ff1e1ad9705b8b6fc5bab2542aefc3315fc24cf7

jobs:
  formatting:
    name: Formatting (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: clang-format gersemi just oxfmt precious uv

      - name: Check formatting
        run: just check format all

  native-linux:
    name: Native package (Linux ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - name: Clang
            compiler: clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: cmake ninja just

      - name: Install GCC 14
        if: matrix.compiler == 'gcc'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14

      - name: Install pinned LLVM
        if: matrix.compiler == 'clang'
        # This is the caller-provided compiler dimension, independent of Mise's
        # repository tooling.
        uses: hydn10/setup-llvm@v1
        with:
          version: ${{ env.LLVM_VERSION }}
          linux-x64-sha256: ${{ env.LLVM_LINUX_X64_SHA256 }}
          windows-x64-sha256: ${{ env.LLVM_WINDOWS_X64_SHA256 }}

      - name: Select the installed Clang compiler
        if: matrix.compiler == 'clang'
        shell: bash
        run: |
          echo "CC=${LLVM_PATH}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PATH}/bin/clang++" >> "$GITHUB_ENV"

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux
          toolchain: ${{ matrix.compiler }}
          feature-profile: core

      - name: Validate native static Release
        run: just cpp validate vcpkg-release

      - name: Check installed static CMake package
        run: just cpp check-installed vcpkg-release

      - name: Validate native shared Release
        run: just cpp validate vcpkg-shared-release

      - name: Check installed shared CMake package
        run: just cpp check-installed vcpkg-shared-release

  native-windows:
    name: Native package (Windows ${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSVC
            compiler: msvc
            cc: cl.exe
            cxx: cl.exe
          - name: clang-cl
            compiler: clang-cl
            cc: clang-cl.exe
            cxx: clang-cl.exe
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: cmake ninja just

      - name: Install pinned LLVM
        if: matrix.compiler == 'clang-cl'
        # This is the caller-provided compiler dimension, independent of Mise's
        # repository tooling.
        uses: hydn10/setup-llvm@v1
        with:
          version: ${{ env.LLVM_VERSION }}
          linux-x64-sha256: ${{ env.LLVM_LINUX_X64_SHA256 }}
          windows-x64-sha256: ${{ env.LLVM_WINDOWS_X64_SHA256 }}

      - name: Set up the Visual Studio environment
        shell: pwsh
        run: |
          $info = vswhere -latest -format json | ConvertFrom-Json
          $moduleName = 'Microsoft.VisualStudio.DevShell.dll'
          $modulePath = Join-Path $info.installationPath 'Common7' 'Tools' $moduleName
          Import-Module $modulePath
          Enter-VsDevShell `
            -VsInstanceId $info.instanceId `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -no_logo"
          Get-ChildItem 'env:' | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }

      - name: Select the installed clang-cl compiler
        if: matrix.compiler == 'clang-cl'
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:LLVM_PATH 'bin'
          $llvmBin >> $env:GITHUB_PATH
          "CC=$(Join-Path $llvmBin 'clang-cl.exe')" >> $env:GITHUB_ENV
          "CXX=$(Join-Path $llvmBin 'clang-cl.exe')" >> $env:GITHUB_ENV

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows
          toolchain: ${{ matrix.compiler }}
          feature-profile: core

      - name: Validate native static Release
        run: just cpp validate vcpkg-release

      - name: Check installed static CMake package
        run: just cpp check-installed vcpkg-release

      - name: Validate native shared Release
        run: just cpp validate vcpkg-shared-release

      - name: Check installed shared CMake package
        run: just cpp check-installed vcpkg-shared-release

  quality-linux:
    name: Native quality (Linux Clang, Python 3.12)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: clang-tools cmake ninja just

      - name: Install build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Install pinned LLVM
        # This is the caller-provided compiler dimension.
        # Repository clang-tidy comes from Mise above.
        uses: hydn10/setup-llvm@v1
        with:
          version: ${{ env.LLVM_VERSION }}
          linux-x64-sha256: ${{ env.LLVM_LINUX_X64_SHA256 }}
          windows-x64-sha256: ${{ env.LLVM_WINDOWS_X64_SHA256 }}

      - name: Select the installed Clang compiler
        shell: bash
        run: |
          echo "CC=${LLVM_PATH}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PATH}/bin/clang++" >> "$GITHUB_ENV"

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux
          toolchain: clang
          feature-profile: core-python

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate native Python quality configuration
        run: |
          # Configure freshly while keeping vcpkg's Python build within the runner disk limit.
          cmake --preset vcpkg-python-quality --fresh -DVCPKG_INSTALL_OPTIONS=--clean-after-build
          just cpp build vcpkg-python-quality
          just cpp verify-headers vcpkg-python-quality
          just cpp test vcpkg-python-quality

  quality-windows:
    name: Native quality (Windows clang-cl, Python 3.12)
    runs-on: windows-latest
    env:
      CC: clang-cl.exe
      CXX: clang-cl.exe
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: clang-tools cmake ninja just

      - name: Install pinned LLVM
        # This is the caller-provided compiler dimension.
        # Repository clang-tidy comes from Mise above.
        uses: hydn10/setup-llvm@v1
        with:
          version: ${{ env.LLVM_VERSION }}
          linux-x64-sha256: ${{ env.LLVM_LINUX_X64_SHA256 }}
          windows-x64-sha256: ${{ env.LLVM_WINDOWS_X64_SHA256 }}

      - name: Set up the Visual Studio environment
        shell: pwsh
        run: |
          $info = vswhere -latest -format json | ConvertFrom-Json
          $moduleName = 'Microsoft.VisualStudio.DevShell.dll'
          $modulePath = Join-Path $info.installationPath 'Common7' 'Tools' $moduleName
          Import-Module $modulePath
          Enter-VsDevShell `
            -VsInstanceId $info.instanceId `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -no_logo"
          Get-ChildItem 'env:' | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }

      - name: Select the installed clang-cl compiler
        shell: pwsh
        run: |
          $llvmBin = Join-Path $env:LLVM_PATH 'bin'
          $llvmBin >> $env:GITHUB_PATH
          "CC=$(Join-Path $llvmBin 'clang-cl.exe')" >> $env:GITHUB_ENV
          "CXX=$(Join-Path $llvmBin 'clang-cl.exe')" >> $env:GITHUB_ENV

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows
          toolchain: clang-cl
          feature-profile: core-python

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate native Python quality configuration
        run: |
          # Configure freshly while keeping vcpkg's Python build within the runner disk limit.
          cmake --preset vcpkg-python-quality --fresh -DVCPKG_INSTALL_OPTIONS=--clean-after-build
          just cpp build vcpkg-python-quality
          just cpp verify-headers vcpkg-python-quality
          just cpp test vcpkg-python-quality

  python-apps-linux:
    name: Python apps (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: &python-lines
          - "3.12"
          - "3.14"
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux
          toolchain: gcc
          feature-profile: core

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: cmake ninja just uv

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Check Python applications
        run: just py smoke

  python-apps-windows:
    name: Python apps (Windows, Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: *python-lines
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: cmake ninja just uv

      - name: Set up the Visual Studio environment
        shell: pwsh
        run: |
          $info = vswhere -latest -format json | ConvertFrom-Json
          $moduleName = 'Microsoft.VisualStudio.DevShell.dll'
          $modulePath = Join-Path $info.installationPath 'Common7' 'Tools' $moduleName
          Import-Module $modulePath
          Enter-VsDevShell `
            -VsInstanceId $info.instanceId `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -no_logo"
          Get-ChildItem 'env:' | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows
          toolchain: msvc
          feature-profile: core

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Check Python applications
        run: just py smoke

  wheel-linux:
    name: Wheel (Linux, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: *python-lines
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-linux
          toolchain: gcc
          feature-profile: core

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: cmake ninja just uv

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build and smoke-test the wheel
        run: just py check-wheel

  wheel-windows:
    name: Wheel (Windows, Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: *python-lines
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up repository tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: cmake ninja just uv

      - name: Set up the Visual Studio environment
        shell: pwsh
        run: |
          $info = vswhere -latest -format json | ConvertFrom-Json
          $moduleName = 'Microsoft.VisualStudio.DevShell.dll'
          $modulePath = Join-Path $info.installationPath 'Common7' 'Tools' $moduleName
          Import-Module $modulePath
          Enter-VsDevShell `
            -VsInstanceId $info.instanceId `
            -SkipAutomaticLocation `
            -DevCmdArguments "-arch=x64 -no_logo"
          Get-ChildItem 'env:' | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }

      - name: Set up vcpkg and its binary cache
        uses: ./.github/actions/setup-vcpkg
        with:
          triplet: x64-windows
          toolchain: msvc
          feature-profile: core

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build and smoke-test the wheel
        run: just py check-wheel

  nix:
    name: Nix
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0

      - name: Check the flake
        run: nix flake check -L

      - name: Smoke-test the development workflow
        run: nix develop --command just verify

      - name: Create smoke-test output directory
        run: mkdir -p out/smoke/nix

      - name: Smoke-test packaged plotting application
        run: nix run .#mylib-plot -- --points 3 --save out/smoke/nix/plot.png

      - name: Smoke-test packaged CSV application
        run: nix run .#mylib-dump -- --points 3 --output out/smoke/nix/values.csv
