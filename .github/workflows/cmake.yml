name: CMake CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} C++ build and CTest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (Release)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_EXAMPLES=ON -DBUILD_PYTHON=OFF -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: CTest
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Run example (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x build/mylib_example || true
          ./build/mylib_example

      - name: Run example (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "build/Release/mylib_example.exe") {
            & "build/Release/mylib_example.exe"
          } elseif (Test-Path "build/mylib_example.exe") {
            & "build/mylib_example.exe"
          } else {
            Get-ChildItem -Recurse build | Write-Output
            throw "mylib_example.exe not found"
          }

