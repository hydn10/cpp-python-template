name: Nix CI

on:
  push:
  pull_request:

jobs:
  nix-build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Nix flake show
        run: nix flake show

      - name: Build default package (C++ library)
        run: nix build .#default -L

      - name: Run C++ example via flake app
        run: nix run .#mylib-example

      # Optional: build python-app env to ensure uv2nix pipeline resolves
      - name: Build python-app env
        run: nix build .#python-app -L

