min_version = "2026.7.12"

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "windows-x64"]
windows_shim_mode = "exe"

[tool_alias]
clang-format = "conda:clang-format"
clang-tools = "conda:clang-tools"
gersemi = "pipx:gersemi"
oxfmt = "npm:oxfmt"
precious = "github:houseabsolute/precious"

[tools]
# Loose selectors are the repository's request for a current compatible tool;
# mise.lock records the exact reproducible snapshot for each one.
act = "latest"
just = "latest"
actionlint = "latest"
shellcheck = "latest"

# These versions are part of the repository's development-tool policy.
cmake = "4.1"
# conda-forge splits the LLVM tools across these two packages: clang-format and
# clang-tools (which supplies clang-tidy).
clang-format = "22.1.8"
clang-tools = "22.1.8"
oxfmt = "0.61.0"
gersemi = "0.25.4"

# The exact locked versions are snapshots, not repository policy.
ninja = "latest"
uv = "latest"
precious = "latest"

[env]
# The Conda packages expose their executables through mise, but Windows also
# needs the packages' runtime DLL directories on PATH for clang-tidy. Keep each
# entry conditional so selective installs do not require unrelated LLVM tools.
_.path = { path = [
  "{% if tools[\"clang-format\"] is defined %}{{ tools[\"clang-format\"].path }}/Library/bin{% endif %}",
  "{% if tools[\"clang-tools\"] is defined %}{{ tools[\"clang-tools\"].path }}/Library/bin{% endif %}",
  "{% if tools[\"clang-format\"] is defined %}{{ tools[\"clang-format\"].path }}/bin{% endif %}",
  "{% if tools[\"clang-tools\"] is defined %}{{ tools[\"clang-tools\"].path }}/bin{% endif %}",
], tools = true }
